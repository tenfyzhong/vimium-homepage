<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vimium Homepage</title>
  <link rel="icon" href="data:,">
  <script>
    // Early head script: canonical-URL enforcement only. The Vomnibar is vimium's
    // native UI (summoned with o); the page never touches vimium's DOM.
    (function () {
      'use strict';

      // ---- canonical URL enforcement -------------------------------------
      // Keep the final href canonical (URL hygiene): /index.html -> ./ and
      // paths without a trailing slash get one appended.
      var pathname = window.location.pathname;
      if (/\/index\.html$/.test(pathname)) {
        window.location.replace('./');
        return;
      }
      var lastSegment = pathname.slice(pathname.lastIndexOf('/') + 1);
      if (pathname.length > 1 && !pathname.endsWith('/') && lastSegment.indexOf('.') === -1) {
        window.location.replace(pathname + '/');
        return;
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0e14;
      --panel: #12161f;
      --text: #e6e6e6;
      --weak: #8b93a7;
      --amber: #ffb000;
      --green: #00e5a0;
      --divider: rgba(230, 230, 230, 0.08);
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    /* light scheme: warm paper, applied when the system prefers light */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f1ea;
        --panel: #ffffff;
        --text: #1a1d23;
        --weak: #6b7280;
        --amber: #b45309;
        --green: #047857;
        --divider: rgba(26, 29, 23, 0.10);
      }

      /* tone the atmosphere down so the paper scheme stays quiet and AA */
      body::before {
        opacity: 0.18;
      }

      body::after {
        background: radial-gradient(ellipse at center, rgba(180, 83, 9, 0.04), rgba(4, 120, 87, 0.02) 45%, transparent 70%);
      }

      .link-card:hover {
        border-color: rgba(180, 83, 9, 0.35);
      }

      #add-link-button:hover {
        border-color: rgba(4, 120, 87, 0.4);
      }

      #link-save-button {
        color: #ffffff;
      }

      .link-delete:hover {
        color: #dc2626;
        border-color: #dc2626;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* subtle film grain, tiled inline PNG (zero external requests) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAJklEQVR42mP4//8/OxLmZgASwkDMhizADxXkAWJemIAgEAsBMR8Ah8Uwl+jg3VcAAAAASUVORK5CYII=");
      background-repeat: repeat;
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    /* top gradient glow */
    body::after {
      content: '';
      position: fixed;
      top: -32%;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 72vh;
      background: radial-gradient(ellipse at center, rgba(255, 176, 0, 0.05), rgba(0, 229, 160, 0.03) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      padding-bottom: 40px;
    }

    .hero {
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #clock {
      font-size: clamp(64px, 15vw, 120px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--text);
      text-shadow: 0 0 32px rgba(255, 176, 0, 0.12);
    }

    #clock .colon {
      color: var(--amber);
      animation: vh-blink 1s steps(1) infinite;
    }

    #date-line {
      color: var(--weak);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    #greeting {
      color: var(--green);
      font-size: 15px;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
    }

    .links-wrap {
      max-width: min(720px, 88vw);
      margin: 48px auto 0;
      padding: 0 24px;
    }

    .links-title {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 400;
      color: var(--weak);
      letter-spacing: 0.2em;
    }

    #quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .link-card {
      position: relative;
      display: block;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--divider);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .link-card:hover {
      border-color: rgba(255, 176, 0, 0.35);
      transform: translateY(-1px);
    }

    .link-card .link-label {
      display: block;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .link-card .link-host {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--weak);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-card .link-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .link-card:hover .link-actions {
      opacity: 1;
    }

    .link-edit,
    .link-delete {
      padding: 2px 6px;
      background: none;
      border: 1px solid var(--divider);
      border-radius: 4px;
      color: var(--weak);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      line-height: 1.4;
    }

    .link-edit:hover {
      color: var(--green);
      border-color: var(--green);
    }

    .link-delete:hover {
      color: #ff5f56;
      border-color: #ff5f56;
    }

    #add-link-button {
      padding: 14px;
      background: transparent;
      border: 1px dashed var(--divider);
      border-radius: 10px;
      color: var(--weak);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    #add-link-button:hover {
      color: var(--green);
      border-color: rgba(0, 229, 160, 0.4);
    }

    #link-form {
      display: none;
      margin-top: 14px;
      gap: 10px;
    }

    #link-form.open {
      display: flex;
    }

    #link-label-input,
    #link-url-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
    }

    #link-label-input:focus,
    #link-url-input:focus {
      outline: none;
      border-color: var(--amber);
    }

    #link-save-button,
    #link-cancel-button {
      padding: 10px 16px;
      background: var(--panel);
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
    }

    #link-save-button {
      background: var(--green);
      border-color: var(--green);
      color: #06120d;
      font-weight: 700;
    }

    footer {
      max-width: min(720px, 88vw);
      margin: 48px auto 0;
      padding: 0 24px;
      text-align: center;
      color: var(--weak);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    @keyframes vh-blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0.15;
      }
    }

    @keyframes vh-reveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero {
      animation: vh-reveal 0.5s ease-out both;
    }

    .links-wrap {
      animation: vh-reveal 0.5s ease-out 0.16s both;
    }

    footer {
      animation: vh-reveal 0.5s ease-out 0.24s both;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div id="clock">00<span class="colon">:</span>00<span class="colon">:</span>00</div>
      <div id="date-line"></div>
      <div id="greeting"></div>
    </header>

    <section class="links-wrap">
      <h2 class="links-title">Quick Links</h2>
      <div id="quick-links"></div>
      <div id="link-form">
        <input id="link-label-input" type="text" placeholder="Name" spellcheck="false" autocomplete="off">
        <input id="link-url-input" type="text" placeholder="URL https://…" spellcheck="false" autocomplete="off">
        <button id="link-save-button" type="button">Save</button>
        <button id="link-cancel-button" type="button">Cancel</button>
      </div>
    </section>

    <footer>
      <span id="footer-hint">vimium-homepage · press o for the Vomnibar</span>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var LINKS_KEY = 'vimium-homepage-links';
      var DEFAULT_LINKS = [
        { label: 'GitHub', url: 'https://github.com/' },
        { label: 'Gmail', url: 'https://mail.google.com/' },
        { label: 'YouTube', url: 'https://www.youtube.com/' },
        { label: 'Zhihu', url: 'https://www.zhihu.com/' },
        { label: 'Bilibili', url: 'https://www.bilibili.com/' },
        { label: 'Juejin', url: 'https://juejin.cn/' }
      ];

      // ---- clock / greeting / date --------------------------------------
      var clockEl = document.getElementById('clock');
      var dateEl = document.getElementById('date-line');
      var greetingEl = document.getElementById('greeting');

      function pad(n) {
        return n < 10 ? '0' + n : String(n);
      }

      function greetingFor(h) {
        if (h >= 5 && h < 12) {
          return 'Good morning';
        }
        if (h >= 12 && h < 18) {
          return 'Good afternoon';
        }
        if (h >= 18 && h < 23) {
          return 'Good evening';
        }
        return 'Late night';
      }

      function tick() {
        var now = new Date();
        clockEl.innerHTML =
          pad(now.getHours()) +
          '<span class="colon">:</span>' +
          pad(now.getMinutes()) +
          '<span class="colon">:</span>' +
          pad(now.getSeconds());
        dateEl.textContent =
          MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear() + ' · ' + WEEKDAYS[now.getDay()];
        greetingEl.textContent = greetingFor(now.getHours());
      }

      tick();
      setInterval(tick, 1000);

      // ---- quick links ----------------------------------------------------
      var linksEl = document.getElementById('quick-links');
      var formEl = document.getElementById('link-form');
      var labelInput = document.getElementById('link-label-input');
      var urlInput = document.getElementById('link-url-input');
      var editingIndex = -1;

      function isSafeLinkUrl(u) {
        try {
          var proto = new URL(u).protocol;
          return proto === 'http:' || proto === 'https:';
        } catch (e) {
          return false;
        }
      }

      function loadLinks() {
        try {
          var raw = localStorage.getItem(LINKS_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              return parsed.filter(function (l) {
                return (
                  l &&
                  typeof l.label === 'string' &&
                  typeof l.url === 'string' &&
                  isSafeLinkUrl(l.url)
                );
              });
            }
          }
        } catch (e) {
          // fall through to defaults
        }
        return DEFAULT_LINKS.slice();
      }

      function saveLinks(links) {
        localStorage.setItem(LINKS_KEY, JSON.stringify(links));
      }

      var links = loadLinks();

      function hostOf(url) {
        try {
          return new URL(url).hostname;
        } catch (e) {
          var s = String(url).replace(/^https?:\/\//i, '');
          return s.length > 32 ? s.slice(0, 32) + '…' : s;
        }
      }

      function openForm(index) {
        editingIndex = index;
        if (index >= 0) {
          labelInput.value = links[index].label;
          urlInput.value = links[index].url;
        } else {
          labelInput.value = '';
          urlInput.value = '';
        }
        formEl.classList.add('open');
        labelInput.focus();
      }

      function closeForm() {
        formEl.classList.remove('open');
        editingIndex = -1;
      }

      function commitForm() {
        var label = labelInput.value.trim();
        var url = urlInput.value.trim();
        if (!label || !url) {
          return;
        }
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        var parsedUrl;
        try {
          parsedUrl = new URL(url);
        } catch (e) {
          return;
        }
        if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
          return;
        }
        if (editingIndex >= 0) {
          links[editingIndex] = { label: label, url: url };
        } else {
          links.push({ label: label, url: url });
        }
        saveLinks(links);
        renderLinks();
        closeForm();
      }

      function renderLinks() {
        linksEl.innerHTML = '';
        links.forEach(function (link, i) {
          var card = document.createElement('a');
          card.className = 'link-card';
          card.href = link.url;
          card.target = '_blank';
          card.rel = 'noopener';

          var label = document.createElement('span');
          label.className = 'link-label';
          label.textContent = link.label;

          var host = document.createElement('span');
          host.className = 'link-host';
          host.textContent = hostOf(link.url);

          var actions = document.createElement('span');
          actions.className = 'link-actions';

          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'link-edit';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            openForm(i);
          });

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'link-delete';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            links.splice(i, 1);
            saveLinks(links);
            renderLinks();
          });

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          card.appendChild(label);
          card.appendChild(host);
          card.appendChild(actions);
          linksEl.appendChild(card);
        });

        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.id = 'add-link-button';
        addBtn.textContent = '＋ Add';
        addBtn.addEventListener('click', function () {
          openForm(-1);
        });
        linksEl.appendChild(addBtn);
      }

      document.getElementById('link-save-button').addEventListener('click', commitForm);
      document.getElementById('link-cancel-button').addEventListener('click', closeForm);
      labelInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          commitForm();
        }
      });
      urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          commitForm();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && formEl.classList.contains('open')) {
          closeForm();
        }
      });

      renderLinks();
    })();
  </script>
</body>
</html>
